name: Deploy Backend to Hugging Face Space

on:
  push:
    branches:
      - cicd

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: chinhde
          HF_SPACE_NAME: fake-news-detection-backend
        run: |
          set -e
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Clone the HF Space repo
          rm -rf hf_space || true
          git clone https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME hf_space

          # Clean hf_space contents but keep .git
          cd hf_space
          find . -maxdepth 1 ! -name . ! -name .git -exec rm -rf {} +
          cd ..

          # Copy current repo contents to hf_space (exclude local git and model downloads)
          rsync -av --exclude='.git' --exclude='model/downloads' ./ hf_space/

          cd hf_space
          # Remove caches
          find . -name "__pycache__" -type d -exec rm -rf {} + || true

          git add --all
          if git diff-index --quiet HEAD; then
            echo "No changes to deploy."
          else
            git commit -m "Auto-deploy from GitHub Actions ($GITHUB_SHA)"
            git push origin main
          fi
